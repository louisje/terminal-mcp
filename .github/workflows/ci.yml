name: CI

on:
  push:
    branches: [main, feat/codemode]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [22, 24]
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify CLI runs
        run: node dist/index.js --help

  test:
    # The shutdown tests spawn real PTYs and drive the built server over stdio.
    # Windows is excluded: its PTY layer and default shell make the terminal
    # assertions a different test, not the same one on another OS.
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: [22, 24]
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install optional test CLI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ripgrep fd-find

      - name: Install optional test CLI dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ripgrep fd

      - name: Run tests
        run: npm test
